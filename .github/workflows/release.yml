name: Release

# Builds the `unityrs` Python wheels (abi3, Python 3.10+) and the sdist for a
# version tag and publishes them to PyPI through trusted publishing: PyPI
# trusts this workflow file in the `pypi` environment, so no token is stored.
# A manual run is always a dry run: it builds and checks the distributions
# and uploads them as artifacts, and never touches PyPI. Only a `v*` tag
# push publishes.
# The crates go to crates.io by hand, in dependency order (`cargo publish`
# with the maintainer's token); this workflow publishes no crate.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Only the publish job gets more: an OIDC token for PyPI.
permissions:
  contents: read

jobs:
  # The tag names the version the manifests carry, or nothing is built; a
  # manual run from a branch checks only that the manifests agree.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      toolchain: ${{ steps.read.outputs.toolchain }}
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: read
        name: Compare the tag with the wheel and workspace versions
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'EOF'
          import os, re, tomllib
          with open("crates/unityrs-py/pyproject.toml", "rb") as fh:
              wheel = tomllib.load(fh)["project"]["version"]
          with open("Cargo.toml", "rb") as fh:
              crates = tomllib.load(fh)["workspace"]["package"]["version"]
          with open("rust-toolchain.toml", "rb") as fh:
              toolchain = tomllib.load(fh)["toolchain"]["channel"]
          tag = os.environ["REF_NAME"].removeprefix("v") if os.environ["REF_TYPE"] == "tag" else wheel
          if not tag == wheel == crates:
              raise SystemExit(f"tag {tag}, pyproject.toml {wheel}, Cargo.toml {crates}: they must agree")
          # The maturin action puts the toolchain into a shell script: a
          # version number and nothing else.
          if not re.fullmatch(r"[0-9]+\.[0-9]+(\.[0-9]+)?", toolchain):
              raise SystemExit(f"rust-toolchain.toml's channel {toolchain!r} is not a version number")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"toolchain={toolchain}\nversion={wheel}\n")
          EOF

  wheels:
    needs: version
    name: wheel (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos-15, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # One abi3 wheel per platform (pyo3's abi3-py310), built in a
      # manylinux_2_28 container on Linux. The toolchain is rust-toolchain.toml's.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.9.6"
          rust-toolchain: ${{ needs.version.outputs.toolchain }}
          target: ${{ matrix.target }}
          manylinux: "2_28"
          command: build
          args: --release --locked --out dist --manifest-path crates/unityrs-py/Cargo.toml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.9.6"
          rust-toolchain: ${{ needs.version.outputs.toolchain }}
          command: sdist
          args: --out dist --manifest-path crates/unityrs-py/Cargo.toml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Every run, dry or not: the exact set of distributions, at the tag's
  # version (the manifests' on a branch), and the metadata PyPI will read.
  # The set it passes is the one artifact the publish job uploads.
  check:
    needs: [version, wheels, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Each artifact in a folder of its own, so no file can overwrite another.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/artifacts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: One sdist and one wheel per target, at the release's version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          MANIFEST_VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ "$REF_TYPE" = tag ]; then version=${REF_NAME#v}; else version=$MANIFEST_VERSION; fi
          python3 scripts/release_dists.py --version "$version" "$RUNNER_TEMP/artifacts" dist
      - name: twine check
        run: |
          python -m venv "$RUNNER_TEMP/twine"
          "$RUNNER_TEMP/twine/bin/python" -m pip install twine==7.0.0
          "$RUNNER_TEMP/twine/bin/twine" check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checked-dists
          path: dist/
          if-no-files-found: error

  # Only a `v*` tag push publishes; a manual run never does.
  publish:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # PyPI's trusted publisher names this environment, which the repository
    # protects with required reviewers and a `v*` tag deployment rule.
    environment:
      name: pypi
      url: https://pypi.org/project/unityrs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checked-dists
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
