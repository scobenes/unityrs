name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2

  # THIRD_PARTY_LICENSES is generated by cargo-about from about.toml and
  # about.hbs. This fails when the committed copy is not what they generate.
  third-party-licenses:
    runs-on: ubuntu-latest
    env:
      # scripts/third-party-licenses refuses any other version, so keep the two equal.
      CARGO_ABOUT_VERSION: 0.9.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # Restored and saved as separate steps, so the binary is cached even when
      # the check below fails.
      - name: Restore cargo-about
        id: cargo-about
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo-about
          key: cargo-about-${{ env.CARGO_ABOUT_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-about
        if: steps.cargo-about.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version "=$CARGO_ABOUT_VERSION" --locked --features cli --root ~/.cargo-about
      - name: Save cargo-about
        if: steps.cargo-about.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo-about
          key: ${{ steps.cargo-about.outputs.cache-primary-key }}
      - name: Check THIRD_PARTY_LICENSES
        run: |
          export PATH="$HOME/.cargo-about/bin:$PATH"
          scripts/third-party-licenses --check

  # The parity tools' Python side, on the pinned oracle stack (docs/DESIGN.md
  # section 3) and with UnityPy's samples, so the tests that need them run.
  parity-py:
    runs-on: ubuntu-latest
    defaults:
      run:
        # bash -eo pipefail: a test run piped through tee still fails the step.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the oracle stack (exact wheels, hash-checked)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r tools/parity/requirements-oracle.txt
          python -m pip check
          python -m pip freeze --all
      # The samples are game bundles: fetched here, outside the checkout, and
      # never committed. The cache is keyed by the pins, and a restored copy is
      # checked against them like a download; only checked samples are saved.
      - name: Restore UnityPy's samples
        id: samples
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/unitypy-samples
          key: unitypy-samples-${{ hashFiles('tools/parity/unitypy_samples.json') }}
      - name: Fetch UnityPy's samples, or check the restored ones, against the pins
        run: |
          python tools/parity/fetch_unitypy_samples.py "$RUNNER_TEMP/unitypy-samples"
          echo "UNITYRS_UNITYPY_SAMPLES=$RUNNER_TEMP/unitypy-samples" >> "$GITHUB_ENV"
      - name: Save UnityPy's samples
        if: steps.samples.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/unitypy-samples
          key: ${{ steps.samples.outputs.cache-primary-key }}
      # With the oracle stack and the samples in place, every test has what it
      # needs, so a skipped test fails the job instead of passing unnoticed.
      - name: Self-tests (parity tools and the spikes' scripts)
        run: |
          for suite in tools/parity/tests crates/unityrs-spike-rabex/scripts/tests crates/unityrs-bench-lzma; do
            echo "::group::$suite"
            status=0
            python -m unittest discover -s "$suite" -v 2>&1 | tee "$RUNNER_TEMP/unittest.log" || status=$?
            echo "::endgroup::"
            result=$(tail -n 1 "$RUNNER_TEMP/unittest.log")
            if [ "$status" != 0 ] || [ "$result" != OK ]; then
              echo "::error::$suite: $result (every test must run and pass here)"
              exit 1
            fi
          done
      # A smoke test that the oracle runs here; the unityrs side is compared later.
      - name: Dump the samples with the oracle and compare the dump with itself
        run: |
          python tools/parity/unitypy_dump.py "$UNITYRS_UNITYPY_SAMPLES" -q -o "$RUNNER_TEMP/dumps/samples.jsonl.gz"
          python tools/parity/compare.py "$RUNNER_TEMP/dumps/samples.jsonl.gz" "$RUNNER_TEMP/dumps/samples.jsonl.gz" \
            --json "$RUNNER_TEMP/dumps/report.json"
