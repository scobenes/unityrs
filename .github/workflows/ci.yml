name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every action is pinned to a full commit SHA, with its release tag in a
# comment; look one up with `gh api repos/OWNER/REPO/git/ref/tags/TAG`
# (dereferencing an annotated tag through git/tags/SHA). Every job has a
# timeout, so a hung step fails in minutes instead of GitHub's six hours.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # G6 (docs/plans/core.md section 6): no stub is left in any crate.
      - name: No stub is left (G6)
        run: sh scripts/stub-check.sh
      # No unmanageable files: no tracked Rust or Python file over 800 lines
      # outside scripts/file-size-allowlist.txt (generated tables, fixture
      # generators, and parity tools left whole until PR #5 merges), and
      # every entry there with its reason, within its limit and its pin.
      - name: No file is over 800 lines
        run: sh scripts/file-size-check.sh

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # THIRD_PARTY_LICENSES is generated by cargo-about from about.toml and
  # about.hbs. This fails when the committed copy is not what they generate.
  third-party-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # scripts/third-party-licenses refuses any other version, so keep the two equal.
      CARGO_ABOUT_VERSION: 0.9.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # Restored and saved as separate steps, so the binary is cached even when
      # the check below fails.
      - name: Restore cargo-about
        id: cargo-about
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo-about
          key: cargo-about-${{ env.CARGO_ABOUT_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-about
        if: steps.cargo-about.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version "=$CARGO_ABOUT_VERSION" --locked --features cli --root ~/.cargo-about
      - name: Save cargo-about
        if: steps.cargo-about.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo-about
          key: ${{ steps.cargo-about.outputs.cache-primary-key }}
      - name: Check THIRD_PARTY_LICENSES
        run: |
          export PATH="$HOME/.cargo-about/bin:$PATH"
          scripts/third-party-licenses --check

  # The scripts' own tests. They need PyYAML (the workflow test parses this
  # file), which is no part of the oracle, so they run in a venv of their own
  # that holds scripts/requirements-tests.txt, hash-checked.
  scripts-py:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install PyYAML (an exact wheel, hash-checked) into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/scripts"
          "$RUNNER_TEMP/scripts/bin/python" -m pip install --disable-pip-version-check --require-hashes \
            -r scripts/requirements-tests.txt
      # A skipped test, or fewer tests than the minimum, fails the job.
      - name: Self-tests (scripts)
        run: '"$RUNNER_TEMP/scripts/bin/python" scripts/unittest-suites scripts/tests=34'

  # The parity tools' Python side, on the pinned oracle stack (docs/DESIGN.md
  # section 3) and with UnityPy's samples, so the tests that need them run;
  # what core takes from the oracle: the generated tables and G7; and the
  # gate's rows that need no corpus: UnityPy's samples, G2 and G3.
  parity-py:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        # bash -eo pipefail: a step fails at its first failing command.
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # A fresh venv holds the pins and nothing else, so CI's oracle is the
      # pinned set: oracle_env.py --exact fails on anything missing, at
      # another version, or unpinned (pip and setuptools aside).
      - name: Install the oracle stack (exact wheels, hash-checked) into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/oracle"
          echo "$RUNNER_TEMP/oracle/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/oracle/bin/python" -m pip install --disable-pip-version-check --require-hashes \
            -r tools/parity/requirements-oracle.txt
          "$RUNNER_TEMP/oracle/bin/python" -m pip check
          "$RUNNER_TEMP/oracle/bin/python" -m pip freeze --all
          "$RUNNER_TEMP/oracle/bin/python" tools/parity/oracle_env.py --exact
      # The samples are game bundles: fetched here, outside the checkout, and
      # never committed. The cache is keyed by the pins. The fetcher checks a
      # restored copy like a download, and refuses one that holds anything but
      # the pinned samples as regular files; only checked samples are saved.
      - name: Restore UnityPy's samples
        id: samples
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/unitypy-samples
          key: unitypy-samples-${{ hashFiles('tools/parity/unitypy_samples.json') }}
      - name: Fetch UnityPy's samples, or check the restored ones, against the pins
        run: |
          python tools/parity/fetch_unitypy_samples.py "$RUNNER_TEMP/unitypy-samples"
          echo "UNITYRS_UNITYPY_SAMPLES=$RUNNER_TEMP/unitypy-samples" >> "$GITHUB_ENV"
      - name: Save UnityPy's samples
        if: steps.samples.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/unitypy-samples
          key: ${{ steps.samples.outputs.cache-primary-key }}
      # With the oracle stack and the samples in place, every test has what it
      # needs: a skipped test, or a suite running fewer tests than it holds
      # (a module discovery no longer finds), fails the job. Raise a minimum
      # when a suite gains tests; scripts/unittest-suites prints each count.
      # gen_tables.py compares Python's lower case with Rust's from a program
      # it compiles, and tpk.py --check runs unityrs-tpk's G7 test: both need
      # the pinned toolchain.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: The generated tables equal what the oracle generates
        run: python tools/gen/gen_tables.py --check
      # The committed synthetic fixtures, then G7 on UnityPy's own TPK: its
      # outcomes are written outside the checkout and nothing is committed.
      # The test fails, never skips, once the job has set UNITYRS_ORACLE_TPK.
      - name: G7, the TPK provider against UnityPy's Tpk.py
        run: python tools/fixtures/tpk.py --check
      # Core's other recorded oracle fixtures, replayed by cargo test without
      # Python: each script regenerates its fixtures in memory and fails
      # naming any that drifted from it (files.py and env.py build their
      # inputs with unityrs-testkit, so they need the toolchain too).
      - name: The scaffold's and packages B to E's oracle fixtures are current
        run: |
          python tools/fixtures/scaffold.py --check
          python tools/fixtures/pure_python_rules.py --check
          python tools/fixtures/walk.py --check
          python tools/fixtures/files.py --check
          python tools/fixtures/env.py --check
          python tools/fixtures/dump.py --check
          python tools/fixtures/index.py --check
      - name: Self-tests (parity tools and the LZMA spike's scripts)
        run: >-
          python scripts/unittest-suites
          tools/parity/tests=279
          crates/unityrs-bench-lzma=8
      # The gate's rows that need no corpus (docs/plans/core.md sections 6
      # and 10), each a unityrs dump compared with the oracle's: compare.py
      # and value_cases.py exit non-zero on any difference, and compare.py's
      # --oracle refuses a reference the oracle did not write on the pinned
      # stack. TPK is the oracle's own, which UnityPy reads for a stripped
      # object.
      - name: Build unityrs and the matrix writer (release)
        run: |
          cargo build --release --locked -p unityrs-cli
          cargo build --release --locked -p unityrs-dump --example write_matrix
          unitypy=$(python -c 'import os, UnityPy; print(os.path.dirname(UnityPy.__file__))')
          echo "TPK=$unitypy/resources/lzma.tpk" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dumps"
      - name: UnityPy's samples, dumped by the oracle and by unityrs, compare equal
        run: |
          python tools/parity/unitypy_dump.py "$UNITYRS_UNITYPY_SAMPLES" -q -o "$RUNNER_TEMP/dumps/samples.jsonl.gz"
          target/release/unityrs dump "$UNITYRS_UNITYPY_SAMPLES" -q --tpk "$TPK" \
            -o "$RUNNER_TEMP/dumps/samples-unityrs.jsonl.gz"
          python tools/parity/compare.py --oracle "$RUNNER_TEMP/dumps/samples.jsonl.gz" \
            "$RUNNER_TEMP/dumps/samples-unityrs.jsonl.gz" --json "$RUNNER_TEMP/dumps/samples-report.json"
      - name: G2, the value cases through `unityrs values`
        run: python tools/parity/value_cases.py target/release/unityrs
      - name: G3, the synthetic matrix dumped by the oracle and by unityrs, compare equal
        run: |
          target/release/examples/write_matrix "$RUNNER_TEMP/g3"
          python tools/parity/unitypy_dump.py "$RUNNER_TEMP/g3" -q -o "$RUNNER_TEMP/dumps/g3.jsonl.gz"
          target/release/unityrs dump "$RUNNER_TEMP/g3" -q --tpk "$TPK" -o "$RUNNER_TEMP/dumps/g3-unityrs.jsonl.gz"
          python tools/parity/compare.py --oracle "$RUNNER_TEMP/dumps/g3.jsonl.gz" \
            "$RUNNER_TEMP/dumps/g3-unityrs.jsonl.gz"
