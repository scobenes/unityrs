name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every action is pinned to a full commit SHA, with its release tag in a
# comment; look one up with `gh api repos/OWNER/REPO/git/ref/tags/TAG`
# (dereferencing an annotated tag through git/tags/SHA). Every job has a
# timeout, so a hung step fails in minutes instead of GitHub's six hours.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # G6 (docs/plans/core.md section 6): no stub is left in any crate.
      - name: No stub is left (G6)
        run: sh scripts/stub-check.sh
      # No unmanageable files: no tracked Rust or Python file over 800 lines
      # outside scripts/file-size-allowlist.txt (generated tables and fixture
      # generators), and every entry there with its reason, within its limit
      # and its pin.
      - name: No file is over 800 lines
        run: sh scripts/file-size-check.sh

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      # The fuzz crate is a workspace of its own, with a deny.toml of its own
      # (fuzz/deny.toml says why): its dependencies never ship, but they are
      # held to the same licences. The config is named, so the check never
      # depends on where cargo-deny looks for one: the repository's refuses
      # libfuzzer-sys's NCSA.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: fuzz/Cargo.toml
          arguments: --all-features --config fuzz/deny.toml

  # The fuzz targets (fuzz/, docs/plans/core.md section 6) keep compiling
  # and run: each is built with the nightly and cargo-fuzz the nightly fuzz
  # workflow pins (fuzz.yml; keep the two equal) and runs for 30 seconds
  # from the testkit's seeds, four at a time. A finding fails the job, with
  # the input uploaded. fuzz.yml runs each for an hour a night.
  fuzz-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NIGHTLY: nightly-2026-11-09
      CARGO_FUZZ_VERSION: 0.13.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and the nightly
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup toolchain install "$NIGHTLY" --profile minimal
      - name: Restore cargo-fuzz
        id: cargo-fuzz
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo-fuzz
          key: cargo-fuzz-${{ env.CARGO_FUZZ_VERSION }}-${{ env.NIGHTLY }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-fuzz
        if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo +"$NIGHTLY" install cargo-fuzz --version "=$CARGO_FUZZ_VERSION" --locked --root ~/.cargo-fuzz
      - name: Save cargo-fuzz
        if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo-fuzz
          key: ${{ steps.cargo-fuzz.outputs.cache-primary-key }}
      - name: Format (the fuzz crate)
        run: cargo fmt --check --manifest-path fuzz/Cargo.toml
      - name: Write the seeds from the testkit's builders
        run: cargo run --locked -p unityrs-testkit --example fuzz_seeds -- "$RUNNER_TEMP/seeds"
      - name: Build every target
        working-directory: fuzz
        run: |
          export PATH="$HOME/.cargo-fuzz/bin:$PATH"
          cargo +"$NIGHTLY" fetch --locked
          cargo +"$NIGHTLY" fuzz build -a
      # The harness's own tests (fuzz/src/tests.rs): each value case reaches
      # the memory bound it picks, the lz4 check's limits, and the texture
      # and meshdecode checks' answers under each meter.
      - name: Test the harness
        working-directory: fuzz
        run: cargo +"$NIGHTLY" test --locked --lib
      - name: Run each target for 30 seconds
        working-directory: fuzz
        run: |
          export PATH="$HOME/.cargo-fuzz/bin:$PATH"
          run() {
            mkdir -p "$RUNNER_TEMP/corpus/$1"
            cargo +"$NIGHTLY" fuzz run -a "$1" "$RUNNER_TEMP/corpus/$1" "$RUNNER_TEMP/seeds/$1" -- \
              -max_total_time=30 -timeout=10 -malloc_limit_mb=2048 -rss_limit_mb=3072 \
              -print_final_stats=1 > "$RUNNER_TEMP/fuzz-$1.log" 2>&1
          }
          failed=""
          for batch in "detect bundle serialized typetree" "boost_read python_read write_after_read lz4" "texture meshdecode"; do
            pids=""
            for t in $batch; do
              run "$t" &
              pids="$pids $t:$!"
            done
            for p in $pids; do
              wait "${p#*:}" || failed="$failed ${p%%:*}"
            done
          done
          for t in detect bundle serialized typetree boost_read python_read write_after_read lz4 texture meshdecode; do
            echo "== $t"
            grep -E '^(stat::|#[0-9]+ +DONE)' "$RUNNER_TEMP/fuzz-$t.log" || true
          done
          for t in $failed; do
            echo "== $t failed:"
            tail -n 80 "$RUNNER_TEMP/fuzz-$t.log"
          done
          [ -z "$failed" ]
      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-build-${{ github.run_id }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # THIRD_PARTY_LICENSES is generated by cargo-about from about.toml and
  # about.hbs. This fails when the committed copy is not what they generate.
  third-party-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # scripts/third-party-licenses refuses any other version, so keep the two equal.
      CARGO_ABOUT_VERSION: 0.9.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # Restored and saved as separate steps, so the binary is cached even when
      # the check below fails.
      - name: Restore cargo-about
        id: cargo-about
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo-about
          key: cargo-about-${{ env.CARGO_ABOUT_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-about
        if: steps.cargo-about.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version "=$CARGO_ABOUT_VERSION" --locked --features cli --root ~/.cargo-about
      - name: Save cargo-about
        if: steps.cargo-about.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo-about
          key: ${{ steps.cargo-about.outputs.cache-primary-key }}
      - name: Check THIRD_PARTY_LICENSES
        run: |
          export PATH="$HOME/.cargo-about/bin:$PATH"
          scripts/third-party-licenses --check

  # The scripts' own tests. They need PyYAML (the workflow test parses this
  # file), which is no part of the oracle, so they run in a venv of their own
  # that holds scripts/requirements-tests.txt, hash-checked.
  scripts-py:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install PyYAML (an exact wheel, hash-checked) into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/scripts"
          "$RUNNER_TEMP/scripts/bin/python" -m pip install --disable-pip-version-check --require-hashes \
            -r scripts/requirements-tests.txt
      # A skipped test, or fewer tests than the minimum, fails the job.
      - name: Self-tests (scripts)
        run: '"$RUNNER_TEMP/scripts/bin/python" scripts/unittest-suites scripts/tests=102'

  # The parity tools' Python side, on the pinned oracle stack (docs/DESIGN.md
  # section 3) and with UnityPy's samples, so the tests that need them run;
  # what core takes from the oracle: the generated tables and G7; the
  # gate's rows that need no corpus: UnityPy's samples, G2 and G3; and
  # unityrs-imageio's X3 and X4, whose step builds its own zlib 1.2.13
  # (fetched by a versioned URL, verified against the crate's vendor
  # manifest) and loads it under LD_LIBRARY_PATH within the step.
  parity-py:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        # bash -eo pipefail: a step fails at its first failing command.
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # A fresh venv holds the pins and nothing else, so CI's oracle is the
      # pinned set: oracle_env.py --exact fails on anything missing, at
      # another version, or unpinned (pip and setuptools aside).
      - name: Install the oracle stack (exact wheels, hash-checked) into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/oracle"
          echo "$RUNNER_TEMP/oracle/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/oracle/bin/python" -m pip install --disable-pip-version-check --require-hashes \
            -r tools/parity/requirements-oracle.txt
          "$RUNNER_TEMP/oracle/bin/python" -m pip check
          "$RUNNER_TEMP/oracle/bin/python" -m pip freeze --all
          "$RUNNER_TEMP/oracle/bin/python" tools/parity/oracle_env.py --exact
      # The samples are game bundles: fetched here, outside the checkout, and
      # never committed. The cache is keyed by the pins. The fetcher checks a
      # restored copy like a download, and refuses one that holds anything but
      # the pinned samples as regular files; only checked samples are saved.
      - name: Restore UnityPy's samples
        id: samples
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/unitypy-samples
          key: unitypy-samples-${{ hashFiles('tools/parity/unitypy_samples.json') }}
      - name: Fetch UnityPy's samples, or check the restored ones, against the pins
        run: |
          python tools/parity/fetch_unitypy_samples.py "$RUNNER_TEMP/unitypy-samples"
          echo "UNITYRS_UNITYPY_SAMPLES=$RUNNER_TEMP/unitypy-samples" >> "$GITHUB_ENV"
      - name: Save UnityPy's samples
        if: steps.samples.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/unitypy-samples
          key: ${{ steps.samples.outputs.cache-primary-key }}
      # With the oracle stack and the samples in place, every test has what it
      # needs: a skipped test, or a suite running fewer tests than it holds
      # (a module discovery no longer finds), fails the job. Raise a minimum
      # when a suite gains tests; scripts/unittest-suites prints each count.
      # gen_tables.py compares Python's lower case with Rust's from a program
      # it compiles, and tpk.py --check runs unityrs-tpk's G7 test: both need
      # the pinned toolchain.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: The generated tables equal what the oracle generates
        run: python tools/gen/gen_tables.py --check
      # Every citation of UnityPy's source in the repository, bare `:N` lines
      # included, names a whole span of lines of 1.25.2 (the oracle's, whose
      # files the script checks against the wheel's digest), and every file
      # under a crate's src/ that cites one has a "Ported from" or "Generated
      # by ... from UnityPy 1.25.2" header, as about.hbs says. UnityPyBoost's
      # sources are not in the wheel; scripts/unitypy_boost.py pins their line
      # counts, digests, blank lines, top-level definitions and brace depths,
      # and a C++ range cuts no definition and no brace block (its statements
      # are not read). --boost checks every pin against the copy of the
      # sources scripts/tests/unitypyboost_1_25_2/ keeps, by the scans that
      # made it (review round 16: no gate ran it, so a wrong digit passed).
      - name: UnityPy citations name lines of 1.25.2, and the files citing them say they port it
        run: python scripts/unitypy_citations.py --boost scripts/tests/unitypyboost_1_25_2
      # The committed synthetic fixtures, then G7 on UnityPy's own TPK: its
      # outcomes are written outside the checkout and nothing is committed.
      # The test fails, never skips, once the job has set UNITYRS_ORACLE_TPK.
      - name: G7, the TPK provider against UnityPy's Tpk.py
        run: python tools/fixtures/tpk.py --check
      # Core's other recorded oracle fixtures, replayed by cargo test without
      # Python: each script regenerates its fixtures in memory and fails
      # naming any that drifted from it (files.py and env.py build their
      # inputs with unityrs-testkit, so they need the toolchain too). Every
      # tools/fixtures/*.py run as a program is listed here, in G7's step,
      # in the sprite renderer's (sprite.py, below) or in X3 and X4's
      # (imageio.py, below); the rest are modules a listed script imports
      # (walk.py records
      # through walk_build.py, walk_elements.py, walk_mirror.py,
      # walk_reentry.py, walk_runs.py and walk_write.py, env.py through env_paths.py and
      # env_race.py, dump.py through dump_inputs.py, tpk.py through
      # tpk_build.py, sprite.py through sprite_build.py, sprite_cases.py and
      # sprite_solve.py), as scripts/tests/test_ci_workflow.py checks, and each
      # module also runs on its own (tools/parity/tests/test_fixture_modules.py).
      # no_tree.py reads with tpk.py's synthetic TPKs, unityrs-tpk's test
      # replays it. texture.py records UnityPy's and Pillow's texture decodes
      # and selection, which unityrs-texture's tests replay. meshdecode.py
      # records UnityPy's MeshHandler and UnityPyBoost's unpack_vertexdata,
      # through meshdecode_build.py, meshdecode_cases.py and
      # meshdecode_trees.py (its hand-built trees), which
      # unityrs-meshdecode's tests replay. ngui.py records the NGUI cutter's
      # reference (tools/parity/ngui_cutter.py) on the testkit's NGUI scenes,
      # whose bundles unityrs-testkit's test holds to it; under the runner's
      # zlib it compares all but the PNGs' digests and the one winner case
      # whose `prefer` names a PNG's MD5, and says so (the pixels, the JSON
      # and the other winners are compared); the X3, X4 and X5 step runs it
      # again under zlib 1.2.13, comparing every field.
      - name: The scaffold's, packages B to E's, the texture decoders', the mesh handler's and the NGUI cutter's oracle fixtures are current
        run: |
          python tools/fixtures/scaffold.py --check
          python tools/fixtures/pure_python_rules.py --check
          python tools/fixtures/walk.py --check
          python tools/fixtures/files.py --check
          python tools/fixtures/env.py --check
          python tools/fixtures/dump.py --check
          python tools/fixtures/index.py --check
          python tools/fixtures/folders.py --check
          python tools/fixtures/no_tree.py --check
          python tools/fixtures/texture.py --check
          python tools/fixtures/meshdecode.py --check
          python tools/fixtures/ngui.py --check
      # sprite.py records UnityPy's SpriteHelper on hand-built sprites (its
      # trees and cases in sprite_build.py and sprite_cases.py, over
      # meshdecode.py's builders), into sprite.json, and numpy's solution bits
      # for sprite_solve.py's seeded systems, into sprite_solve.json, which
      # unityrs-texture's sprite tests replay. The affine cases and the
      # systems solve through numpy's OpenBLAS, whose bits follow the kernel
      # the host picks, so this step runs only on the reference host, x86-64
      # with avx2 and fma, with the Haswell kernel pinned in the step's env
      # before the interpreter starts; tools/parity/oracle_env.py reads the
      # core OpenBLAS runs, and --reference fails on any other
      # (docs/plans/extract.md section 3, item 6).
      - name: The sprite renderer's oracle fixtures are current, on the reference host's kernel
        env:
          OPENBLAS_CORETYPE: Haswell
        run: |
          for flag in avx2 fma; do
            if ! grep -qw "$flag" /proc/cpuinfo; then
              echo "not the reference host: no $flag" >&2
              exit 1
            fi
          done
          python tools/fixtures/sprite.py --check --reference
      # The mesh handler's cases again on UnityPy's own TPK trees, as G7 runs
      # on its TPK: the TPK's trees and rows exist only in memory and in the
      # pipe to the crate's replay, and --tpk's own audit hook refuses any
      # write to a path in its process; the step fails where the hand-built
      # trees' outcomes differ from them or the replay of them fails. It
      # prints the counts and the names of any cases that differ, never what
      # the TPK's trees hold (the log is public; --verbose is for a local
      # run). The guard is against accidental writes and leaks (caches, temp
      # files, bytecode, dumps, logs), not code written to evade it, which is
      # a review matter. The hook cannot see a native write or the replay's
      # process, so three checks follow the run, each reported by one fixed
      # line with a count, never a path, their commands' own errors sent to
      # /dev/null; a command that fails is a failed check, and every check
      # runs whatever the others give: the checkout's git status (new,
      # removed and changed tracked paths, ignored files and target/
      # included), taken after the test binary is built, the same as before
      # the run; the run's own TMPDIR, outside the checkout, empty; and no
      # file in the checkout newer than the run's start, which also sees an
      # ignored file rewritten in place. A cargo test after --no-run touches
      # nothing under target/.
      - name: The mesh handler's cases answer alike on the TPK's trees
        run: |
          cargo test --locked -p unityrs-meshdecode --test oracle --no-run
          status=0
          was="$RUNNER_TEMP/tpk-before.txt" now="$RUNNER_TEMP/tpk-after.txt"
          tmp="$RUNNER_TEMP/tpk-tmp" mark="$RUNNER_TEMP/tpk-mark"
          before=ok
          git status --porcelain -uall --ignored > "$was" 2> /dev/null || before=failed
          mkdir "$tmp"
          touch "$mark"
          TMPDIR="$tmp" python tools/fixtures/meshdecode.py --tpk || status=$?
          if [ "$before" != ok ] || ! git status --porcelain -uall --ignored > "$now" 2> /dev/null; then
            echo "--tpk check: git status could not be taken"
            status=1
          elif cmp -s "$was" "$now" 2> /dev/null; then
            echo "--tpk check: the checkout's git status is unchanged"
          else
            n=$( { diff "$was" "$now" 2> /dev/null || true; } | grep -c '^[<>]' || true)
            echo "--tpk check: the checkout's git status changed: $n lines differ"
            status=1
          fi
          if ! n=$(find "$tmp" -mindepth 1 2> /dev/null | wc -l); then
            echo "--tpk check: its TMPDIR could not be read whole ($n paths seen)"
            status=1
          elif [ "$n" -ne 0 ]; then
            echo "--tpk check: $n paths left in its TMPDIR"
            status=1
          else
            echo "--tpk check: its TMPDIR is empty"
          fi
          if ! n=$(find . -path ./.git -prune -o -type f -newer "$mark" -print 2> /dev/null | wc -l); then
            echo "--tpk check: the checkout could not be read whole ($n newer files seen)"
            status=1
          elif [ "$n" -ne 0 ]; then
            echo "--tpk check: $n files in the checkout newer than the run's start"
            status=1
          else
            echo "--tpk check: no file in the checkout is newer than the run's start"
          fi
          exit "$status"
      # unityrs-imageio's X3 and X4: imageio.py records Pillow 9.5.0's PNGs,
      # whose bytes are zlib's, and the reference is zlib 1.2.13, the oracle
      # image's; under another zlib (the runner's) it compares all but the
      # PNG bytes, and says so, as ngui.py does for the NGUI cutter's
      # reference (X5). So the step builds zlib 1.2.13 from its
      # release tarball, sha256-pinned here and in the crate's manifest,
      # which zlib_vendor.py verify also holds the vendored files to; then
      # runs the check with the build's libz.so.1 first on the library path,
      # which Pillow's _imaging and Python's zlib load by that soname, and
      # asserts both report 1.2.13 there, so every field of both is compared. It
      # builds with -std=gnu99, as crates/unityrs-imageio/build.rs does.
      - name: X3, X4 and X5, Pillow's PNGs over zlib 1.2.13, and the vendored zlib against its tarball
        run: |
          tarball="$RUNNER_TEMP/zlib-1.2.13.tar.gz"
          curl -fsSL --connect-timeout 30 --max-time 300 --retry 3 --retry-all-errors -o "$tarball" \
            https://github.com/madler/zlib/releases/download/v1.2.13/zlib-1.2.13.tar.gz
          echo "b3a24de97a8fdbc835b9833169501030b8977031bcb54b3b3ac13740f846ab30  $tarball" | sha256sum -c -
          python scripts/zlib_vendor.py verify "$tarball"
          tar -xzf "$tarball" -C "$RUNNER_TEMP"
          zlib="$RUNNER_TEMP/zlib-1.2.13"
          (cd "$zlib" && CFLAGS="-O2 -std=gnu99" ./configure && make -j"$(nproc)")
          test -f "$zlib/libz.so.1"
          export LD_LIBRARY_PATH="$zlib"
          python -c 'import zlib; from PIL import Image; v = (Image.core.zlib_version, zlib.ZLIB_RUNTIME_VERSION); assert v == ("1.2.13",) * 2, v'
          python tools/fixtures/imageio.py --check
          python tools/fixtures/ngui.py --check
      - name: Self-tests (parity tools, the perf tools and the LZMA spike's scripts)
        run: >-
          python scripts/unittest-suites
          tools/parity/tests=521
          tools/perf/tests=10
          crates/unityrs-bench-lzma=8
      # The gate's rows that need no corpus (docs/plans/core.md sections 6
      # and 10), each a unityrs dump compared with the oracle's: compare.py
      # and value_cases.py exit non-zero on any difference, and compare.py's
      # --oracle refuses a reference the oracle did not write on the pinned
      # stack. TPK is the oracle's own, which UnityPy reads for a stripped
      # object.
      - name: Build unityrs and the matrix writer (release)
        run: |
          cargo build --release --locked -p unityrs-cli
          cargo build --release --locked -p unityrs-dump --example write_matrix
          unitypy=$(python -c 'import os, UnityPy; print(os.path.dirname(UnityPy.__file__))')
          echo "TPK=$unitypy/resources/lzma.tpk" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dumps"
      - name: UnityPy's samples, dumped by the oracle and by unityrs, compare equal
        run: |
          python tools/parity/unitypy_dump.py "$UNITYRS_UNITYPY_SAMPLES" -q -o "$RUNNER_TEMP/dumps/samples.jsonl.gz"
          target/release/unityrs dump "$UNITYRS_UNITYPY_SAMPLES" -q --tpk "$TPK" \
            -o "$RUNNER_TEMP/dumps/samples-unityrs.jsonl.gz"
          python tools/parity/compare.py --oracle "$RUNNER_TEMP/dumps/samples.jsonl.gz" \
            "$RUNNER_TEMP/dumps/samples-unityrs.jsonl.gz" --json "$RUNNER_TEMP/dumps/samples-report.json"
      - name: G2, the value cases through `unityrs values`
        run: python tools/parity/value_cases.py target/release/unityrs
      - name: G3, the synthetic matrix dumped by the oracle and by unityrs, compare equal
        run: |
          target/release/examples/write_matrix "$RUNNER_TEMP/g3"
          python tools/parity/unitypy_dump.py "$RUNNER_TEMP/g3" -q -o "$RUNNER_TEMP/dumps/g3.jsonl.gz"
          target/release/unityrs dump "$RUNNER_TEMP/g3" -q --tpk "$TPK" -o "$RUNNER_TEMP/dumps/g3-unityrs.jsonl.gz"
          python tools/parity/compare.py --oracle "$RUNNER_TEMP/dumps/g3.jsonl.gz" \
            "$RUNNER_TEMP/dumps/g3-unityrs.jsonl.gz"
