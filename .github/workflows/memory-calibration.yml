name: Memory calibration
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'tools/memory/**'
      - 'docs/memory/**'
      - 'docs/BATCH_SPEC.md'
      - 'docs/plans/batch.md'
      - '.github/workflows/memory-calibration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: memory-calibration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    name: Native ${{ matrix.arch }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Assert native architecture and the certified page size
        env:
          EXPECT_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECT_ARCH"
          test "$(getconf PAGESIZE)" = 4096
      - name: Check a committed selection without regenerating it
        if: hashFiles('docs/memory/constants-v1.json') != ''
        run: >-
          python3 tools/memory/regenerate.py --compiled-evidence docs/memory/constants-v1.json
          --rust-output crates/unityrs-batch/src/bound/measured.rs --check
      - name: Check the provisional fallback while evidence is absent
        if: hashFiles('docs/memory/constants-v1.json') == ''
        run: >-
          python3 tools/memory/regenerate.py --bootstrap
          --rust-output crates/unityrs-batch/src/bound/measured.rs --check
      - name: Run synthetic measurements and independent gates
        run: >-
          python3 tools/memory/collect.py --native --profile ${{ matrix.profile }}
          --output "${{ runner.temp }}/aggregate.json"
      - name: Upload the aggregate record only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memory-${{ matrix.arch }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/aggregate.json
          if-no-files-found: error
          retention-days: 14
