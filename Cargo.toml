[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scobenes/unityrs"
authors = ["Scott Benes <scobenes@gmail.com>"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# `--cfg unityrs_no_counters` compiles the core's perf counters out, so the
# perf bench can measure what they cost (docs/plans/core.md section 10).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(unityrs_no_counters)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# Gate G6 (scripts/stub-check.sh): no stub body in any crate, whatever its
# delimiter, spacing or name. Forbidden, not denied, so no attribute (an
# allow of either lint or of `clippy::restriction`) can lower them again.
todo = "forbid"
unimplemented = "forbid"

# Debug and test builds keep only file and line numbers (enough for panics and
# backtraces), and dependencies none: full debug info made each build folder
# 7-8 GB. To step through code in a debugger, set `debug = true` here while
# doing so, and set it back after. Release builds already carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
