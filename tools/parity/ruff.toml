# Lint and format settings for the parity tools: `uvx ruff check` / `uvx ruff format`.
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]

[lint.isort]
# The tools import each other by module name (sys.path holds tools/parity).
known-first-party = ["canonical", "compare", "fetch_unitypy_samples", "oracle_env", "synth", "test_dump", "unitypy_dump"]
