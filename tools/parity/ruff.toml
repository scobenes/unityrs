# Lint and format settings for the parity tools: `uvx ruff check` / `uvx ruff format`.
line-length = 120
target-version = "py311"
# UnityPy git 417d595's own files, kept byte for byte (tests/head_oracle.py pins their git blob ids).
extend-exclude = ["head_417d595"]

[lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]

[lint.isort]
# The tools import each other by module name (sys.path holds tools/parity).
known-first-party = ["canonical", "canonical_decode", "child", "compare", "compare_support", "dump_harness", "dump_records", "fetch_unitypy_samples", "g3b", "head_oracle", "inventory", "object_mode", "oracle_env", "oracle_stack", "pillow_tables", "references", "scratch", "synth", "unitypy_dump"]
