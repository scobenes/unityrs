# cargo-about configuration. THIRD_PARTY_LICENSES is generated from this file
# and about.hbs by scripts/third-party-licenses, and CI runs the same script
# with --check, which fails when the committed copy is stale.
#
# Generation is offline (--frozen), so the file depends only on Cargo.lock and
# the crates' published sources. A crate that ships no licence file gets the
# SPDX text, never a file fetched from its repository's current head.
#
# Every crate the workspace builds is listed, its own members included. Each
# member's LICENSE-MIT and LICENSE-APACHE link to the repository's own, so a
# member is listed with its real notice; the script refuses a notice that is
# still an SPDX template ("<year>", "<copyright holders>").
#
# deny.toml must say the same: its allow list equals `accepted` below, and each
# crate's clarification and accepted licences here have a clarification and an
# exception there (scripts/third_party_licenses_check.py checks both ways), so
# cargo-deny rejects what cargo-about would list.

# The same licences, in the same order, as deny.toml's [licenses] allow list;
# the script checks that they match. The order is cargo-about's preference:
# for an expression like "MIT OR Apache-2.0", the first one listed is used.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MIT-CMU",
    "Unicode-3.0",
]

# liblzma-sys is "MIT OR Apache-2.0", but with the `static` feature its build
# script compiles the xz sources it vendors (liblzma and xz's tuklib), and
# those are 0BSD. The clarification adds that licence and its text. The
# checksums tie it to the files of the release it was written against: when a
# release changes one, cargo-about drops the clarification with a warning, and
# the script fails on any warning, so it cannot lapse unseen. 0BSD is accepted
# for this crate only, here and in deny.toml's exception.
[liblzma-sys]
accepted = ["0BSD"]

[liblzma-sys.clarify]
license = "(MIT OR Apache-2.0) AND 0BSD"

[[liblzma-sys.clarify.files]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "a90e2da47bdc152cfb89e1fb09972143056c417ddbf86122babc83d0a8ad81d1"

[[liblzma-sys.clarify.files]]
path = "LICENSE-APACHE"
license = "Apache-2.0"
checksum = "a60eea817514531668d7e00765731449fe14d059d3249e0bc93b36de45f759f2"

[[liblzma-sys.clarify.files]]
path = "xz/COPYING.0BSD"
license = "0BSD"
checksum = "0b01625d853911cd0e2e088dcfb743261034a091bb379246cb25a14cc4c74bf1"

# The workspace members that port CPython 3.11's standard library are
# PSF-2.0 too (their LICENSE-PSF holds the PSF License Agreement; about.hbs,
# "Ported code"). PSF-2.0 is accepted for those three only, here and in
# deny.toml's exceptions; BSD-2-Clause (unityrs-core's liblz4 port) is in the
# list above.
[unityrs-core]
accepted = ["PSF-2.0"]

[unityrs-dump]
accepted = ["PSF-2.0"]

[unityrs-cli]
accepted = ["PSF-2.0"]

# unityrs-texture's sprite solve ports OpenBLAS files from GotoBLAS2, under
# The University of Texas at Austin's licence: BSD-2-Clause with a "views and
# conclusions" paragraph, BSD-2-Clause-Views (about.hbs, "Ported code"; the
# crate's LICENSE-OPENBLAS-UT). cargo-about does not recognise that text, so
# the clarification names each of the crate's licence files and its licence
# (the OpenBLAS kernels' own notices, LICENSE-OPENBLAS-KERNELS and
# LICENSE-OPENBLAS-DSCAL, among them, as BSD-3-Clause, and the MIT notices
# of the ETC decoders' sources, LICENSE-TEXTURE2DDECODER, LICENSE-ASSETSTUDIO
# and LICENSE-MIKUNYAN),
# with the crate's own expression; the checksums tie it to the files, and a
# changed file drops it with a warning, on which the script fails.
# LICENSE-MIT, LICENSE-APACHE and LICENSE-UNITYPY are links to the
# repository's and unityrs-core's files, so a change to those changes these
# checksums too (and deny.toml's hashes, root and fuzz). The expression is
# the crate's Cargo.toml `license`, which the script holds it to.
# BSD-2-Clause-Views is accepted for this crate only, here and in deny.toml's
# exception.
[unityrs-texture]
accepted = ["BSD-2-Clause-Views"]

[unityrs-texture.clarify]
license = "(MIT OR Apache-2.0) AND MIT AND MIT-CMU AND BSD-3-Clause AND BSD-2-Clause-Views"

[[unityrs-texture.clarify.files]]
path = "LICENSE-MIT"
license = "MIT"
