# UnityCN uses aes 0.8.4 (MIT OR Apache-2.0), accepted by the global list.
[graph]
# Licence checks cover the same supported platforms as about.toml's targets
# list. CI checks bans separately with unfiltered deny-bans.toml (X15).
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]

# Licences any dependency may carry. Copyleft (GPL, AGPL, LGPL, MPL) is not
# allowed: unityrs stays permissive, and GPL projects such as AssetRipper are
# read for format knowledge only, never copied.
#
# about.toml (cargo-about, which writes THIRD_PARTY_LICENSES) must say the same:
# scripts/third_party_licenses_check.py holds the allow list equal to its
# `accepted`, and each clarification and exception below equal to its
# per-crate clarification and accepted licences.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MIT-CMU",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# An exception no crate uses fails the check. A clarification applies only
# while its files hash as listed; when one no longer applies, the licence it
# adds is never seen, its exception goes unused, and the check fails.
unused-license-exception = "deny"

# liblzma-sys is "MIT OR Apache-2.0", but with the `static` feature its build
# script compiles the xz sources it vendors, which are 0BSD (see about.toml).
# The hashes are cargo-deny's: xxHash32 of each file with its line endings
# normalised to LF.
[[licenses.clarify]]
crate = "liblzma-sys"
expression = "(MIT OR Apache-2.0) AND 0BSD"
license-files = [
    { path = "LICENSE-MIT", hash = 0x09841695 },
    { path = "LICENSE-APACHE", hash = 0x24b54f4b },
    { path = "xz/COPYING.0BSD", hash = 0xcc44b1e6 },
]

[[licenses.exceptions]]
crate = "liblzma-sys"
allow = ["0BSD"]

# The workspace members that port CPython 3.11's standard library carry
# PSF-2.0 too (see about.toml).
[[licenses.exceptions]]
crate = "unityrs-core"
allow = ["PSF-2.0"]

[[licenses.exceptions]]
crate = "unityrs-dump"
allow = ["PSF-2.0"]

[[licenses.exceptions]]
crate = "unityrs-cli"
allow = ["PSF-2.0"]

# unityrs-pysum ports CPython 3.15.2's builtin float sum (see about.toml).
[[licenses.exceptions]]
crate = "unityrs-pysum"
allow = ["PSF-2.0"]

# unityrs-texture's sprite solve ports OpenBLAS files from GotoBLAS2, under
# BSD-2-Clause-Views (see about.toml, whose clarification of the crate this
# mirrors, with the crate's own expression).
[[licenses.clarify]]
crate = "unityrs-texture"
expression = "(MIT OR Apache-2.0) AND MIT AND MIT-CMU AND BSD-3-Clause AND BSD-2-Clause-Views AND Apache-2.0 AND LicenseRef-Crunch AND Zlib"
license-files = [
    { path = "LICENSE-MIT", hash = 0xb9a65ddd },
    { path = "LICENSE-APACHE", hash = 0xb5518783 },
    { path = "LICENSE-UNITYPY", hash = 0x25f1bbc9 },
    { path = "LICENSE-PILLOW", hash = 0x14c14357 },
    { path = "LICENSE-TEXTURE2DDECODER", hash = 0x3ca7d091 },
    { path = "LICENSE-ASSETSTUDIO", hash = 0xdb47da6a },
    { path = "LICENSE-MIKUNYAN", hash = 0x57b05276 },
    { path = "LICENSE-OPENBLAS", hash = 0x6722efcf },
    { path = "LICENSE-OPENBLAS-KERNELS", hash = 0xa60839ef },
    { path = "LICENSE-OPENBLAS-DSCAL", hash = 0x31711fb2 },
    { path = "LICENSE-OPENBLAS-UT", hash = 0x443007d2 },
    { path = "LICENSE-ASTCENC", hash = 0xb06ccc7a },
    { path = "LICENSE-CRUNCH", hash = 0x049cfc10 },
    { path = "LICENSE-UNITYCRUNCH", hash = 0x9e44785d },
    { path = "LICENSE-LCMS", hash = 0xf969f967 },
    { path = "LICENSE-BC7ENC", hash = 0xe9691e9f },
    { path = "LICENSE-ETCPAK", hash = 0xa91fc8f1 },
]

[[licenses.exceptions]]
crate = "unityrs-texture"
allow = ["BSD-2-Clause-Views", "LicenseRef-Crunch"]

[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# Keep the constituent ring notices equal to about.toml's clarification.
[[licenses.clarify]]
crate = "ring"
expression = "Apache-2.0 AND ISC"
license-files = [
    { path = "LICENSE-BoringSSL", hash = 0x08f795a3 },
    { path = "LICENSE-other-bits", hash = 0x8b770de2 },
]

# Equal to about.toml's clarifications (it says why): chrono's MIT notice is
# a part of its one licence file, and object_store takes its Apache-2.0
# option, the only text it ships, with Apache Arrow's NOTICE.
[[licenses.clarify]]
crate = "chrono"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "LICENSE.txt", hash = 0xed6eaefe },
]

[[licenses.clarify]]
crate = "object_store"
expression = "Apache-2.0"
license-files = [
    { path = "LICENSE.txt", hash = 0x4a461d6a },
    { path = "NOTICE.txt", hash = 0x4a9a55d8 },
]

# Equal to about.toml: retain vgmstream's complete ISC copyright notice.
[[licenses.clarify]]
crate = "unityrs-audio"
expression = "(MIT OR Apache-2.0) AND MIT AND ISC"
license-files = [
    { path = "LICENSE-MIT", hash = 0xb9a65ddd },
    { path = "LICENSE-APACHE", hash = 0xb5518783 },
    { path = "LICENSE-UNITYPY", hash = 0x25f1bbc9 },
    { path = "LICENSE-FMOD-TOOLKIT", hash = 0x853131fc },
    { path = "LICENSE-VGMSTREAM", hash = 0x41ce9b8b },
    { path = "LICENSE-PYTHON-FSB5", hash = 0xde9a0d8e },
    { path = "LICENSE-FMOD5SHARP", hash = 0x42636d81 },
]

# Use the actual combined notice shipped by lewton 0.10.2.
[[licenses.clarify]]
crate = "lewton"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0x80e073d7 }]

[bans]
# Mirrored in deny-bans.toml, whose graph has no target or crate filters.
# scripts/third_party_licenses_check.py keeps both policies equal.
multiple-versions = "warn"
multiple-versions-include-dev = true

[[bans.deny]]
name = "openssl-sys"

[[bans.deny]]
name = "openssl"

[[bans.deny]]
name = "native-tls"

[[bans.deny]]
name = "aws-lc-rs"

[[bans.deny]]
name = "aws-lc-sys"

[[bans.deny]]
name = "aws-lc-fips-sys"

# `object_store`'s own HTTP client: the store speaks only through the
# engine's connector (`docs/plans/batch.md` 2.9).
[[bans.deny]]
name = "reqwest"

[[bans.deny]]
name = "rustls"
deny-multiple-versions = true

[advisories]
yanked = "deny"
# Unmaintained notices, not vulnerabilities, on two crates that reach the
# build only through object_store (=0.14.2, the engine's store client,
# `docs/plans/batch.md` 2.9). Drop each entry once object_store no longer
# depends on the crate.
ignore = [
    { id = "RUSTSEC-2026-0542", reason = "humantime is unmaintained; transitive through object_store 0.14.2; no known vulnerability" },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; transitive through object_store 0.14.2; no known vulnerability" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# WebFile brotli: BSD-3-Clause/MIT; select the shipped BSD notice,
# equal to about.toml. alloc-no-stdlib uses BSD-3-Clause too.
[[licenses.clarify]]
crate = "brotli-decompressor"
expression = "BSD-3-Clause"
license-files = [{ path = "LICENSE", hash = 0x1a60a92d }]
