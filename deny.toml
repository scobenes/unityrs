# UnityCN uses aes 0.8.4 (MIT OR Apache-2.0), accepted by the global list.
[graph]
# Licence checks cover the same supported platforms as about.toml's targets
# list. CI checks bans separately with unfiltered deny-bans.toml (X15).
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]

# Licences any dependency may carry. Copyleft (GPL, AGPL, LGPL, MPL) is not
# allowed: unityrs stays permissive, and GPL projects such as AssetRipper are
# read for format knowledge only, never copied.
#
# about.toml (cargo-about, which writes THIRD_PARTY_LICENSES) must say the same:
# scripts/third_party_licenses_check.py holds the allow list equal to its
# `accepted`, and each clarification and exception below equal to its
# per-crate clarification and accepted licences.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MIT-CMU",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# An exception no crate uses fails the check. A clarification applies only
# while its files hash as listed; when one no longer applies, the licence it
# adds is never seen, its exception goes unused, and the check fails.
unused-license-exception = "deny"

# liblzma-sys is "MIT OR Apache-2.0", but with the `static` feature its build
# script compiles the xz sources it vendors, which are 0BSD (see about.toml).
# The hashes are cargo-deny's: xxHash32 of each file with its line endings
# normalised to LF.
[[licenses.clarify]]
crate = "liblzma-sys"
expression = "(MIT OR Apache-2.0) AND 0BSD"
license-files = [
    { path = "LICENSE-MIT", hash = 0x09841695 },
    { path = "LICENSE-APACHE", hash = 0x24b54f4b },
    { path = "xz/COPYING.0BSD", hash = 0xcc44b1e6 },
]

[[licenses.exceptions]]
crate = "liblzma-sys"
allow = ["0BSD"]

# The workspace members that port CPython 3.11's standard library carry
# PSF-2.0 too (see about.toml).
[[licenses.exceptions]]
crate = "unityrs-core"
allow = ["PSF-2.0"]

[[licenses.exceptions]]
crate = "unityrs-dump"
allow = ["PSF-2.0"]

[[licenses.exceptions]]
crate = "unityrs-cli"
allow = ["PSF-2.0"]

# unityrs-texture's sprite solve ports OpenBLAS files from GotoBLAS2, under
# BSD-2-Clause-Views (see about.toml, whose clarification of the crate this
# mirrors, with the crate's own expression).
[[licenses.clarify]]
crate = "unityrs-texture"
expression = "(MIT OR Apache-2.0) AND MIT AND MIT-CMU AND BSD-3-Clause AND BSD-2-Clause-Views AND Apache-2.0"
license-files = [
    { path = "LICENSE-MIT", hash = 0xb9a65ddd },
    { path = "LICENSE-APACHE", hash = 0xb5518783 },
    { path = "LICENSE-UNITYPY", hash = 0x25f1bbc9 },
    { path = "LICENSE-PILLOW", hash = 0x14c14357 },
    { path = "LICENSE-TEXTURE2DDECODER", hash = 0x3ca7d091 },
    { path = "LICENSE-ASSETSTUDIO", hash = 0xdb47da6a },
    { path = "LICENSE-MIKUNYAN", hash = 0x57b05276 },
    { path = "LICENSE-OPENBLAS", hash = 0x6722efcf },
    { path = "LICENSE-OPENBLAS-KERNELS", hash = 0xa60839ef },
    { path = "LICENSE-OPENBLAS-DSCAL", hash = 0x31711fb2 },
    { path = "LICENSE-OPENBLAS-UT", hash = 0x443007d2 },
    { path = "LICENSE-ASTCENC", hash = 0xb06ccc7a },
]

[[licenses.exceptions]]
crate = "unityrs-texture"
allow = ["BSD-2-Clause-Views"]

[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# Keep the constituent ring notices equal to about.toml's clarification.
[[licenses.clarify]]
crate = "ring"
expression = "Apache-2.0 AND ISC"
license-files = [
    { path = "LICENSE-BoringSSL", hash = 0x08f795a3 },
    { path = "LICENSE-other-bits", hash = 0x8b770de2 },
]

[bans]
# Mirrored in deny-bans.toml, whose graph has no target or crate filters.
# scripts/third_party_licenses_check.py keeps both policies equal.
multiple-versions = "warn"
multiple-versions-include-dev = true

[[bans.deny]]
name = "openssl-sys"

[[bans.deny]]
name = "openssl"

[[bans.deny]]
name = "native-tls"

[[bans.deny]]
name = "aws-lc-rs"

[[bans.deny]]
name = "aws-lc-sys"

[[bans.deny]]
name = "aws-lc-fips-sys"

[[bans.deny]]
name = "rustls"
deny-multiple-versions = true

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
