[package]
name = "unityrs-py"
description = "Python abi3 bindings for unityrs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND MIT"
repository.workspace = true
authors.workspace = true
# Ships as the `unityrs` wheel on PyPI (pyproject.toml), not on crates.io.
publish = false
# maturin's sdist packs the crate as cargo would: no tests or fixtures.
exclude = ["/tests/", "/python/tests/"]

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
unityrs-core = { path = "../unityrs-core" }
unityrs-tpk = { path = "../unityrs-tpk" }
unityrs-texture = { path = "../unityrs-texture", features = ["encode"] }
unityrs-export = { path = "../unityrs-export" }
unityrs-audio = { path = "../unityrs-audio" }
unityrs-mesh = { path = "../unityrs-mesh" }
unityrs-meshdecode = { path = "../unityrs-meshdecode" }
# Required Python ABI boundary; MIT OR Apache-2.0, already accepted globally.
pyo3 = { version = "=0.29.3", features = ["abi3-py310", "auto-initialize"] }

# The caller thread's stack bounds, to run work inline when they cover it.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
unityrs-testkit = { path = "../unityrs-testkit" }
serde_json = "=1.0.154"

[lints]
workspace = true
