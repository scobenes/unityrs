[build-system]
requires = ["maturin==1.9.6"]
build-backend = "maturin"

[project]
name = "unityrs"
version = "0.0.1"
requires-python = ">=3.10"
# UnityPy record semantics (slots, inheritance, equality, hashing); MIT.
dependencies = ["attrs>=23.2.0"]
description = "Read Unity asset files through the unityrs Rust core."
license = "(MIT OR Apache-2.0) AND MIT"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "LICENSE-UNITYPY", "LICENSE-UNITYPY-HEAD", "THIRD_PARTY_LICENSES"]

[project.scripts]
unityrs = "unityrs.cli:main"

[tool.maturin]
python-source = "python"
module-name = "unityrs._native"
features = ["extension-module"]
