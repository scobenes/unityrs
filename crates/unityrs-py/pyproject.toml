[build-system]
requires = ["maturin==1.9.6"]
build-backend = "maturin"

[project]
name = "unityrs-py"
version = "1.0.0"
requires-python = ">=3.10"
# UnityPy record semantics (slots, inheritance, equality, hashing); MIT.
dependencies = ["attrs>=23.2.0"]
description = "Read Unity asset files through the unityrs Rust core."
# The PyPI page's text: the binding's guide, beside pyproject.toml.
readme = "README.md"
# The extension links the unityrs crates, so their ported code's licences
# are terms here too (each crate's `license`), as is 0BSD for the xz sources
# liblzma-sys compiles in (about.toml); the other crates it links add no
# licence beyond these. THIRD_PARTY_LICENSES holds every notice.
license = "(MIT OR Apache-2.0) AND MIT AND MIT-CMU AND BSD-2-Clause AND BSD-3-Clause AND BSD-2-Clause-Views AND PSF-2.0 AND Apache-2.0 AND ISC AND Zlib AND 0BSD AND LicenseRef-Crunch"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "LICENSE-UNITYPY", "LICENSE-UNITYPY-HEAD", "THIRD_PARTY_LICENSES"]
authors = [{ name = "Scott Benes", email = "scobenes@gmail.com" }]
keywords = ["unity", "unitypy", "assetbundle", "texture", "gamedev"]
# No License classifier: PEP 639's `license` expression replaces them.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/scobenes/unityrs"
Repository = "https://github.com/scobenes/unityrs"
Issues = "https://github.com/scobenes/unityrs/issues"
Changelog = "https://github.com/scobenes/unityrs/blob/main/CHANGELOG.md"

[project.scripts]
unityrs = "unityrs.cli:main"

[tool.maturin]
python-source = "python"
module-name = "unityrs._native"
features = ["extension-module"]
# The wheel's tests and their replay fixtures stay in the repository.
exclude = [{ path = "python/tests/**", format = "sdist" }]
