[package]
name = "unityrs-gltf"
description = "Metered glTF scene model and deterministic streaming GLB writer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["gltf", "glb", "unity", "3d", "export"]
categories = ["rendering::data-formats", "game-development", "graphics"]
# The package carries the code and its notices; tests, fixtures and
# examples stay in the repository.
include = ["/src/**", "/LICENSE-*", "/NOTICE-*"]

[dependencies]
unityrs-core = { version = "1.0.0", path = "../unityrs-core" }

unityrs-mesh = { version = "1.0.0", path = "../unityrs-mesh" }
unityrs-meshdecode = { version = "1.0.0", path = "../unityrs-meshdecode" }
unityrs-scene = { version = "1.0.0", path = "../unityrs-scene" }

unityrs-texture = { version = "1.0.0", path = "../unityrs-texture" }
unityrs-imageio = { version = "1.0.0", path = "../unityrs-imageio" }

[dev-dependencies]
unityrs-testkit = { path = "../unityrs-testkit" }
serde_json = "=1.0.154"

[lints]
workspace = true
