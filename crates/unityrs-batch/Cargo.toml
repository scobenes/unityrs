[package]
name = "unityrs-batch"
description = "The batch engine behind `unityrs batch`: the job spec and its validation, views, exit codes and reasons, the memory bound, the exit line and the counting allocator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Written from docs/BATCH_SPEC.md and docs/plans/batch.md, not ported.
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The core's `LimitKind`, which docs/BATCH_SPEC.md 9.3's table maps, and
# `heap_cost`, the counting allocator's unit.
unityrs-core = { path = "../unityrs-core" }
# The key templates and the key rules (docs/BATCH_SPEC.md 2.1 to 2.3),
# which validation checks a spec's templates and literal keys with: one
# copy, the cutter's.
unityrs-export = { path = "../unityrs-export" }
# The spec's order-preserving tree is built by a serde `Visitor` over
# serde_json's parser (spec/parse), which keeps its recursion limit. Both
# already in the lock. `float_roundtrip` reads a number as the nearest
# double, as Python's `json` does (docs/BATCH_SPEC.md 1's conventions):
# without it `9007199254740991.4` rounds twice, to 2^53.
serde = "=1.0.229"
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
# A bundle's `url` and a sink's `endpoint` are capped as this crate
# serializes them (docs/BATCH_SPEC.md 1.2, 1.6), and their form is its
# parse.
url = "=2.5.8"
# The open flags (spec/read.rs, progress/early.rs) and signal and clock
# calls (sys.rs). Already in the lock.
libc = "=0.2.191"

# Output digests, reusing the exact versions already locked.
md5 = { package = "md-5", version = "=0.11.0", default-features = false }
crc32fast = "=1.5.3"
sha2 = { version = "=0.11.1", default-features = false }

# HTTP's async runtime (`http`; B10c builds it with the IO and time
# drivers). The controller runs on Execution's own reserved threads.
# Published 2026-10-13 (1.53.3: past RUSTSEC-2026-0386).
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "net", "time", "sync"] }

# The HTTP/1.1 parser version is part of the boundary fixture contract.
# `server` exposes hyper's typed `is_parse_too_large` classifier.
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
httpdate = "=1.0.3"
webpki-roots = { version = "=1.0.11", default-features = false }

[features]
test-hooks = ["unityrs-export/test-hooks"]

[dev-dependencies]
# Parser fixtures collect response DATA; production polls its bounded body.
http-body-util = { version = "=0.1.5", default-features = false }
# Scratch for the `JOB.json` cases, `mkfifo` through its child runner, and
# the counting allocator of the validation measurement.
unityrs-testkit = { path = "../unityrs-testkit" }
# A JSON Schema 2020-12 validator, for the tests alone: every per-field
# fixture goes through it and through the parser, which must agree
# (docs/plans/extract.md section 3, item 4). The binary takes no schema
# crate. The lock holds its tree at versions whose licences deny.toml and
# about.toml already accept: borrow-or-share 0.2.1 ("CC0-1.0 OR MIT"; later
# releases are MIT-0 alone) and ahash 0.8.11 (whose getrandom 0.2 needs no
# second r-efi, whose clarification is per crate name).
boon = "=0.6.1"

[lints]
workspace = true
