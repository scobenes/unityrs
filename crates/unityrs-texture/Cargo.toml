[package]
name = "unityrs-texture"
description = "Texture2D decoders with UnityPy 1.25.2's output: the formats it decodes with Pillow's raw and bcn decoders, the ETC and EAC formats, and the ASTC LDR formats."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# It ports UnityPy 1.25.2's texture rules (MIT: export/Texture2DConverter.py,
# helpers/TextureSwizzler.py, enums/TextureFormat.py), whose notice is its
# LICENSE-UNITYPY (a link to unityrs-core's), and Pillow 9.5.0's code as
# UnityPy calls it (MIT-CMU: src/libImaging/BcnDecode.c's BCn block decoders,
# src/libImaging/RawDecode.c's row loop and src/libImaging/Unpack.c's
# unpackers, in src/raw.rs, the width cap of src/decode.c's
# _setimage, and the decompression-bomb check of src/PIL/Image.py's crop),
# whose notice is its LICENSE-PILLOW; texture2ddecoder 1.0.5's ETC and EAC
# decoders (MIT: src/Texture2DDecoder/etc.cpp, in src/etc.rs), whose notices
# are its LICENSE-TEXTURE2DDECODER and those of the code it carries,
# AssetStudio's and mikunyan's, LICENSE-ASSETSTUDIO and LICENSE-MIKUNYAN;
# and, for the sprite renderer
# (src/sprite/), the rest of Pillow's drawing, cropping and transforms that
# UnityPy's SpriteHelper calls, and OpenBLAS 0.3.31's order for numpy's
# linalg.solve (BSD-3-Clause: src/sprite/affine.rs), whose notices are its
# LICENSE-OPENBLAS (the project's) and LICENSE-OPENBLAS-KERNELS and
# LICENSE-OPENBLAS-DSCAL (the kernels' own), and of those files the ones
# from GotoBLAS2 under The University of Texas at Austin's licence
# (BSD-2-Clause-Views), its LICENSE-OPENBLAS-UT. about.toml's clarification
# names each licence file, with this expression (the licence check holds
# the two equal); its package carries all of them. See THIRD_PARTY_LICENSES.
# The ASTC LDR decoder (src/astc/) ports Arm astcenc at commit 631fb04,
# the revision astc-encoder-py 0.1.12 bundles (Apache-2.0), whose notice is
# LICENSE-ASTCENC.
license = "(MIT OR Apache-2.0) AND MIT AND MIT-CMU AND BSD-3-Clause AND BSD-2-Clause-Views AND Apache-2.0"
repository.workspace = true
authors.workspace = true

[dependencies]
# The meter every output buffer is charged to before it is allocated
# (docs/plans/extract.md E59).
unityrs-core = { path = "../unityrs-core" }
# A tight sprite's mesh (MeshHandler.process, get_triangles), which the
# sprite renderer reads (src/sprite.rs).
unityrs-meshdecode = { path = "../unityrs-meshdecode" }
thiserror = "=2.0.21"

[dev-dependencies]
unityrs-testkit = { path = "../unityrs-testkit" }
# The oracle's fixtures (tests/fixtures/, written by tools/fixtures/texture.py
# and tools/fixtures/texture_astc.py) are JSON, and record each image's sha256.
serde_json = "=1.0.154"
sha2 = "=0.11.1"

[lints]
workspace = true
