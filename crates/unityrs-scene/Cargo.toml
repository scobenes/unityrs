[package]
name = "unityrs-scene"
description = "Metered Unity GameObject and Transform graphs and component accessors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND MIT"
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["unity", "gameobject", "transform", "scene", "gamedev"]
categories = ["game-development", "graphics"]
# The package carries the code and its notices; tests, fixtures and
# examples stay in the repository.
include = ["/src/**", "/LICENSE-*", "/NOTICE-*"]

[dependencies]
unityrs-core = { version = "1.0.0", path = "../unityrs-core" }

[dev-dependencies]
unityrs-testkit = { path = "../unityrs-testkit" }
serde_json = "=1.0.154"

[features]
test-counters = ["unityrs-core/test-counters"]

[lints]
workspace = true
