[package]
name = "unityrs-mesh"
description = "Owned, metered Unity mesh geometry and metadata."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND MIT"
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["unity", "mesh", "obj", "geometry", "gamedev"]
categories = ["game-development", "graphics", "rendering::data-formats"]
# The package carries the code and its notices; tests, fixtures and
# examples stay in the repository.
include = ["/src/**", "/LICENSE-*", "/NOTICE-*"]

[dependencies]
unityrs-core = { version = "1.0.0", path = "../unityrs-core" }
unityrs-meshdecode = { version = "1.0.0", path = "../unityrs-meshdecode" }
unityrs-scene = { version = "1.0.0", path = "../unityrs-scene" }
unityrs-texture = { version = "1.0.0", path = "../unityrs-texture" }
unityrs-imageio = { version = "1.0.0", path = "../unityrs-imageio" }
thiserror = "=2.0.21"

[dev-dependencies]
unityrs-tpk = { path = "../unityrs-tpk" }
unityrs-testkit = { path = "../unityrs-testkit" }
serde_json = "=1.0.154"

[lints]
workspace = true
