[package]
name = "unityrs-dump"
description = "The canonical dump (docs/CANONICAL_DUMP.md): unityrs's L0-L3 records for comparison with UnityPy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# It follows UnityPy 1.25.2's load rules (MIT: lib.rs, input/), whose notice
# is its LICENSE-UNITYPY, and ports code of CPython 3.11's standard library
# (PSF-2.0: select/glob.rs, select/index.rs), whose agreement is its
# LICENSE-PSF and the summary of changes the agreement asks for its
# NOTICE-PSF (links to unityrs-core's). See THIRD_PARTY_LICENSES and
# docs/plans/core.md section 2.5.
license = "(MIT OR Apache-2.0) AND MIT AND PSF-2.0"
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
unityrs-core = { path = "../unityrs-core" }
# `--tpk`: the oracle image's TPK as the context's typetree provider.
unityrs-tpk = { path = "../unityrs-tpk" }
# The raw-bytes rule's summaries (CANONICAL_DUMP section 3).
sha2 = "=0.11.1"
# Output streams; the oracle writes level 9 with mtime 0. The same backend
# as unityrs-core's (its manifest says why), so the build holds one.
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
# `-j N`: inputs in parallel, written in order.
rayon = "=1.12.0"
# Reading a corpus index and the value-case files. Output JSON is written by
# hand (CANONICAL_DUMP section 2), never through serde.
serde_json = "=1.0.154"

[dev-dependencies]
unityrs-testkit = { path = "../unityrs-testkit" }

# The perf bench (docs/plans/core.md section 10, `tools/perf/perf.py`); its
# own tests run with the crate's.
[[example]]
name = "bench"
path = "examples/bench/main.rs"
test = true

[lints]
workspace = true
