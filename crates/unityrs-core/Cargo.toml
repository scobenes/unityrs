[package]
name = "unityrs-core"
description = "Read and write Unity asset bundles, serialized files and typetrees."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The crate ports UnityPy 1.25.2 (MIT), liblz4 1.9.4's block decoder
# (BSD-2-Clause: codec/lz4.rs) and code of CPython 3.11's standard library
# (PSF-2.0: detect.rs, pystr.rs), so their notices are files of the crate,
# which its package carries: UnityPy's in LICENSE-UNITYPY, liblz4's in
# LICENSE-LZ4, and CPython's agreement in LICENSE-PSF with the summary of
# changes it asks for in NOTICE-PSF. See THIRD_PARTY_LICENSES and
# docs/plans/core.md section 2.5.
license = "(MIT OR Apache-2.0) AND MIT AND BSD-2-Clause AND PSF-2.0"
repository.workspace = true
authors.workspace = true

# UnityCN also carries the MIT notices in LICENSE-RAZTOOLS and LICENSE-RAZMOTH.
# MIT is already required by every alternative of the crate licence above.
[dependencies]
# UnityCN AES-ECB vectors; RustCrypto, MSRV 1.56, released 2024-02-13.
aes = "=0.8.4"
# Zero-copy buffers: the input, each decoded block run, every entry, every
# SerializedFile and every TypelessData value share one allocation.
bytes = "=1.12.1"
thiserror = "=2.0.21"
# Block codecs (docs/spikes/lzma.md: liblzma static, pinned). LZ4 has no
# dependency: `codec/lz4.rs` ports liblz4 1.9.4's decoder (plan section 3.6).
liblzma = { version = "=0.4.9", features = ["static"] }
# The full-stream gzip check of ImportHelper.check_file_type (rule 7), with
# zlib-rs (zlib's inflate in Rust) as the backend: it refuses what CPython's
# zlib refuses, a distance before the start of the output included, which
# miniz_oxide, flate2's default backend, inflates as zeros (round 9). No
# default features, so no other backend is built; zlib-rs allocates through
# the global allocator (flate2 asks for its `rust-allocator`).
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }

# Test-only (docs/plans/batch.md section 6, CR8): the `testing` module's
# refusal counters, span-read tables and growth invocation marks. The
# testkit's feature of the same name enables it; a release build never
# does, and without it the core compiles as it would without the counters
# (src/counters.rs).
[features]
test-counters = []

[dev-dependencies]
unityrs-testkit = { path = "../unityrs-testkit" }
# Oracle fixtures (tests/fixtures/<owner>/*.json, written by tools/fixtures/)
# are replayed without Python. Already in the lock through unityrs-dump, so
# no package changes Cargo.lock to read them (plan section 7.1).
serde_json = "=1.0.154"
# Only `tests/scaffold_fixtures.rs`, which pins that lz4_flex and liblz4
# disagree both ways (plan section 3.6); no production code decodes with it.
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-decode"] }

[lints]
workspace = true
