[package]
name = "unityrs-audio"
description = "AudioClip dispatch, FSB5 parsing and PCM/ADPCM/Vorbis WAV export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# UnityPy/fmod_toolkit rules (MIT) and vgmstream decoders (ISC).
license = "(MIT OR Apache-2.0) AND MIT AND ISC"
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["unity", "fsb5", "audioclip", "wav", "audio"]
categories = ["multimedia::audio", "game-development"]
# The package carries the code and its notices; tests, fixtures and
# examples stay in the repository.
include = ["/src/**", "/LICENSE-*", "/NOTICE-*"]

[dependencies]
unityrs-core = { version = "1.0.0", path = "../unityrs-core" }
thiserror = "=2.0.21"
# Packet API avoids an intermediate Ogg allocation; decision 19 keeps audio
# outside batch because lewton's internal allocations are infallible.
lewton = { version = "=0.10.2", default-features = false, optional = true }

[features]
default = ["vorbis"]
vorbis = ["dep:lewton"]

[dev-dependencies]
unityrs-testkit = { path = "../unityrs-testkit" }
serde_json = "=1.0.154"

[lints]
workspace = true
