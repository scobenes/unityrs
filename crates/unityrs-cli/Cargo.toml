[package]
name = "unityrs-cli"
description = "Command-line Unity asset extraction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# It ports code of CPython 3.11's standard library (PSF-2.0: args/mod.rs,
# from argparse), whose agreement is its LICENSE-PSF and the summary of
# changes the agreement asks for its NOTICE-PSF (links to unityrs-core's),
# which its package carries. See THIRD_PARTY_LICENSES and
# docs/plans/core.md section 2.5.
license = "(MIT OR Apache-2.0) AND PSF-2.0"
repository.workspace = true
authors.workspace = true

[[bin]]
name = "unityrs"
path = "src/main.rs"

[dependencies]
# `startup_failed`'s errno name (src/batch.rs). Already in the lock.
libc = "=0.2.191"
unityrs-batch = { path = "../unityrs-batch" }
unityrs-core = { path = "../unityrs-core" }
unityrs-mesh = { path = "../unityrs-mesh" }
unityrs-tpk = { path = "../unityrs-tpk" }
unityrs-dump = { path = "../unityrs-dump" }

[dev-dependencies]
# The core's synthetic UnityCN encryptor, which the batch run harness
# (`unityrs-batch/tests/run_support`) builds the encrypted golden with.
aes = "=0.8.4"
serde_json = "=1.0.154"
unityrs-testkit = { path = "../unityrs-testkit" }

[lints]
workspace = true
