[package]
name = "unityrs-tpk"
description = "A TPK (type-tree package) loaded from a path, as a unityrs-core typetree provider."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Its tree resolution ports UnityPy 1.25.2's helpers/Tpk.py (MIT), so the MIT
# notice travels with it. See THIRD_PARTY_LICENSES and docs/plans/core.md
# section 2.5.
license = "(MIT OR Apache-2.0) AND MIT"
repository.workspace = true
authors.workspace = true

[dependencies]
unityrs-core = { path = "../unityrs-core" }
# The vendored rabex 0.2.1 (crates/unityrs-rabex): its TPK reader only, with
# the codecs a TPK uses. No embed-tpk: the TPK comes from a path.
rabex = { package = "unityrs-rabex", path = "../unityrs-rabex", default-features = false, features = ["compression-lzma", "compression-lz4"] }
thiserror = "=2.0.21"

[dev-dependencies]
unityrs-testkit = { path = "../unityrs-testkit" }
# G7's fixtures (tests/fixtures/) and UnityPy's outcomes on the oracle image's
# TPK are JSON.
serde_json = "=1.0.154"

[lints]
workspace = true
