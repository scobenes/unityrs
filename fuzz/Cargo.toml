# The fuzz targets (README.md; docs/plans/core.md section 6, the fuzz plan).
# A workspace of its own, outside the repository's: it builds only with a
# nightly toolchain and cargo-fuzz, and nothing here ships, so its
# dependencies are no part of THIRD_PARTY_LICENSES (README.md, "Licences").
[package]
name = "unityrs-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
unityrs-audio = { path = "../crates/unityrs-audio" }
libfuzzer-sys = "=0.4.13"
# liblz4's own decoder, for the `lz4` target's comparison: 1.10.0 builds the
# liblz4 1.9.4 it vendors, the version python-lz4 4.4.4 wraps in the oracle
# (the target checks `LZ4_versionNumber` at its first input).
lz4-sys = "=1.10.0"
unityrs-core = { path = "../crates/unityrs-core" }
unityrs-export = { path = "../crates/unityrs-export" }
unityrs-imageio = { path = "../crates/unityrs-imageio", features = ["test-reference"] }
unityrs-gltf = { path = "../crates/unityrs-gltf" }
unityrs-mesh = { path = "../crates/unityrs-mesh" }
unityrs-scene = { path = "../crates/unityrs-scene" }
unityrs-meshdecode = { path = "../crates/unityrs-meshdecode" }
unityrs-testkit = { path = "../crates/unityrs-testkit" }
unityrs-texture = { path = "../crates/unityrs-texture" }

[dev-dependencies]
# The harness's test of the `meshdecode` check reads unityrs-meshdecode's
# handler fixture (JSON), as the seed command does.
serde_json = "=1.0.154"

[workspace]
members = ["."]

[profile.release]
debug = "line-tables-only"

[[bin]]
name = "detect"
path = "fuzz_targets/detect.rs"
test = false
doc = false
bench = false

